name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgcli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      audit-packages: true

  release:
    name: Publish complete release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Retrieve tested executables
        uses: actions/download-artifact@v8
        with:
          pattern: tgcli-*-x64
          path: artifacts/release
          merge-multiple: true

      - name: Prepare release notes and checksums
        shell: bash
        run: python tools/release_checks.py prepare --tag "$RELEASE_TAG" --assets artifacts/release --notes artifacts/notes.md

      - name: Attach assets to one draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published" >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file artifacts/notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file artifacts/notes.md --draft
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            artifacts/release/tgcli-linux-x64 artifacts/release/tgcli-osx-x64 \
            artifacts/release/tgcli-win-x64.exe artifacts/release/SHA256SUMS

      - name: Verify draft and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" --dir artifacts/downloaded
          gh release view "$RELEASE_TAG" --json tagName,isDraft,body,assets > artifacts/draft.json
          python tools/release_checks.py verify --tag "$RELEASE_TAG" --assets artifacts/release \
            --notes artifacts/notes.md --downloaded artifacts/downloaded --state artifacts/draft.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
